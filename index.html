<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/globals.css">
    <title>Café Aurora - Start</title>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="/index.html">Hem</a>
                </li>
                <li>
                    <a href="/menu.html">Meny</a>
                </li>
                <li>
                    <a href="/flex-boxes.html">Boxes</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="intro-cafe-section">
            <h1>Välkommnen till Café Aurora</h1>
            <p>Hantverkskaffe och nybakat i hjärtat av Malmö.</p>
            <figure>
                <img class="kaffe" style="width: 300px;" src="/img/coffee.jpg" alt="bild på kaffekopp">
                <figcaption><i>Vår bästa kopp snutkaffe</i></figcaption>
            </figure>
        </section>

        <aside>
            <h2>Veckans nyhet</h2>
            <p class="green">Gästbönor från Etiopien</p>
        </aside>

        <section>
            <h2>Öppettider</h2>
            <table>
                <thead>
                    <tr>
                        <th>Dag</th>
                        <th>Tid</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>Mån-Fre</th>
                        <td>08.00-17.00</td>
                    </tr>
                    <tr>
                        <th>Lör</th>
                        <td>09.00-16.00</td>
                    </tr>
                    <tr>
                        <th>Sön</th>
                        <td>Stängt</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>Café Aurora</p>
    </footer>
</body>

</html>
